# /etc/nginx/sites-available/fittrack-api  (rồi ln -s sang sites-enabled)
# Sau đó:  sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d api.ten-mien-cua-ban.com     # bật HTTPS (Let's Encrypt, tự gia hạn)
server {
    listen 80;
    server_name api.ten-mien-cua-ban.com;

    # Snapshot có thể vài MB. Mặc định nginx chỉ cho 1 MB -> upload lớn bị 413. Phải >= giới hạn 20 MB của API.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
